plugins {
    id 'io.github.damian1000.java-conventions' version '0.4.15'
}

version = '1.0.0'

dependencies {
    implementation 'org.apache.kafka:kafka-streams:4.3.1'
    implementation deps.slf4j.simple
    testImplementation 'org.apache.kafka:kafka-streams-test-utils:4.3.1'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Werror'
}

// Forwards the JUnit condition switch into the forked test JVM. Gradle does not pass its own -D
// system properties to that JVM, so without this the documented live-broker command left
// @Disabled in force: the run reported BUILD SUCCESSFUL having skipped the only test it named.
def deactivateConditions = providers.systemProperty('junit.jupiter.conditions.deactivate').orNull

tasks.named('test') {
    if (deactivateConditions != null) {
        systemProperty 'junit.jupiter.conditions.deactivate', deactivateConditions
    }
}
